<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Mapa · Malba TechVerse</title>
  <link rel="manifest" href="manifest.json" />
  <script>
    /* Captura o evento de instalação o mais cedo possível: o Chrome pode
       dispará-lo antes dos scripts com defer rodarem, e se não houver
       ninguém escutando nesse instante o evento é perdido. */
    window.__bipEvent = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.__bipEvent = e;
      window.dispatchEvent(new Event("bip-ready"));
    });
  </script>
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <meta name="theme-color" content="#241c5e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/fonts-ready.js"></script>
  <style>
    body { background: var(--color-bg-deep); }
    .app-shell { max-width: 100%; padding-bottom: 0; }
    .map-wrap {
      flex: 1;
      display: flex;
      position: relative;
      overflow: auto;
      background: var(--color-bg-deep);
      touch-action: pan-x pan-y pinch-zoom;
    }
    .map-wrap img {
      display: block;
      width: 100%;
      height: auto;
      margin: auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    .map-loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--color-bg-deep); color: var(--color-muted); font-size: 14px; text-align: center; padding: 0 40px;
    }
    .map-title {
      position: absolute; top: calc(14px + var(--safe-top)); left: 14px; right: 14px;
      display: flex; align-items: center; justify-content: space-between; z-index: 5;
      pointer-events: none;
    }
    .map-title h1 {
      font-family: var(--font-display);
      font-size: 20px;
      letter-spacing: 0.03em;
      background: rgba(20,16,46,0.75);
      padding: 7px 16px;
      border-radius: 999px;
      border: 1px solid rgba(79,214,210,0.3);
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
    .map-vignette {
      position: absolute; inset: 0; pointer-events: none; z-index: 4;
      box-shadow: inset 0 0 80px 20px rgba(5,3,16,0.55);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="map-wrap" id="map-wrap">
      <div class="map-title"><h1>Mapa da feira</h1></div>
      <div class="map-vignette"></div>
      <div class="map-loading" id="map-loading">Carregando mapa da feira…</div>
      <img id="map-img" src="img/mapa.png" alt="Mapa da feira de ciências" style="display:none;" />
    </div>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script defer src="js/firebase-config.js"></script>
  <script defer src="js/auth.js"></script>
  <script>document.addEventListener("DOMContentLoaded", () => exigirLogin());</script>

  <script src="js/mapa.js"></script>

  <script defer src="js/nav.js"></script>
  <script defer src="js/install-prompt.js"></script>
</body>
</html>

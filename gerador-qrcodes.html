<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gerador de QR Codes · Malba TechVerse</title>
<link rel="icon" type="image/png" href="img/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #14102e;
    --amber: #f5a623;
    --muted: #6b6b7a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: #eceaf3;
    color: var(--ink);
    font-family: "Inter", sans-serif;
  }
  header {
    max-width: 1000px;
    margin: 0 auto 24px;
    text-align: center;
  }
  h1 {
    font-family: "Bebas Neue", sans-serif;
    font-size: 38px;
    letter-spacing: 0.03em;
    margin: 0 0 6px;
  }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0 0 18px; }
  .toolbar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .toolbar button {
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
  }
  .toolbar button.secondary { background: var(--amber); color: var(--ink); }

  .grid {
    max-width: 1000px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .card {
    background: #fff;
    border: 2px dashed #c9c6d8;
    border-radius: 14px;
    padding: 16px 12px;
    text-align: center;
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .card .num {
    font-family: "Bebas Neue", sans-serif;
    font-size: 22px;
    letter-spacing: 0.04em;
  }
  .card .brand { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; }
  .card canvas { width: 100%; height: auto; max-width: 170px; }
  .card .pts {
    display: inline-block;
    background: var(--amber);
    color: var(--ink);
    font-weight: 800;
    font-size: 12px;
    padding: 3px 12px;
    border-radius: 999px;
    margin-top: 8px;
  }
  .card .code {
    font-family: "JetBrains Mono", monospace;
    font-size: 8px;
    color: var(--muted);
    word-break: break-all;
    margin-top: 8px;
  }

  @media print {
    body { background: #fff; padding: 0; }
    header { display: none; }
    .grid { grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: none; }
    .card { border: 1px dashed #999; }
  }
</style>
</head>
<body>

<header>
  <h1>QR Codes das barracas</h1>
  <p class="subtitle">
    25 códigos · cada um vale 20 pontos · uso único por aluno<br />
    Imprima, recorte e cole um em cada barraca da feira.
  </p>
  <div class="toolbar">
    <button onclick="window.print()">Imprimir / Salvar PDF</button>
    <button class="secondary" id="toggle-codes">Ocultar códigos</button>
  </div>
</header>

<div class="grid" id="grid"></div>

<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script src="js/barracas-config.js"></script>
<script>
  const grid = document.getElementById("grid");

  BARRACA_IDS.forEach((id, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="brand">Malba TechVerse</div>
      <div class="num">Barraca ${String(i + 1).padStart(2, "0")}</div>
      <canvas id="qr-${i}"></canvas>
      <div class="pts">+20 pontos</div>
      <div class="code">${id}</div>
    `;
    grid.appendChild(card);

    new QRious({
      element: card.querySelector("canvas"),
      value: id,
      size: 400,
      background: "#ffffff",
      foreground: "#14102e",
      level: "H"
    });
  });

  // Alterna a exibição do código em texto (útil esconder antes de imprimir,
  // para os alunos não conseguirem digitar o código sem escanear).
  let visivel = true;
  document.getElementById("toggle-codes").addEventListener("click", (e) => {
    visivel = !visivel;
    document.querySelectorAll(".code").forEach((el) => {
      el.style.display = visivel ? "block" : "none";
    });
    e.target.textContent = visivel ? "Ocultar códigos" : "Mostrar códigos";
  });
</script>
</body>
</html>

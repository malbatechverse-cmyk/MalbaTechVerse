<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Prêmios · Malba TechVerse</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#241c5e" />
<link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="stylesheet" href="css/style.css" />
  <script src="js/fonts-ready.js"></script>
<style>
  .prem-grid { display: flex; flex-direction: column; gap: 14px; margin-top: 16px; }
  .prem-card { display: flex; gap: 14px; padding: 14px; align-items: center; }
  .prem-card img { width: 68px; height: 68px; border-radius: var(--radius-md); object-fit: cover; background: #fff; flex-shrink: 0; }
  .prem-nome { font-family: var(--font-display); font-size: clamp(16px, 4.4vw, 18px); letter-spacing: 0.02em; }
  .prem-pts {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 5px;
    color: var(--color-ink); background: linear-gradient(135deg, #ffd479, var(--color-accent-amber));
    font-weight: 800; font-family: var(--font-mono); font-size: 12px; padding: 3px 10px 3px 7px; border-radius: 999px;
  }
  .prem-pts svg { width: 12px; height: 12px; }
  .prem-estoque { font-size: 12px; color: var(--color-muted); margin-top: 6px; }
  .prem-card.esgotado .prem-pts { filter: grayscale(1); }
  .intro-note { display:flex; align-items:center; gap:10px; margin-top:10px; padding: 12px 14px; background: rgba(79,214,210,0.08); border: 1px solid rgba(79,214,210,0.25); border-radius: var(--radius-md); color: var(--color-white); font-size: 13px; }
  .intro-note svg { flex-shrink: 0; color: var(--color-accent-cyan); }
</style>
</head>
<body>
<div class="app-shell">
  <div class="screen">
    <h1>Prêmios</h1>
    <div class="intro-note">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M20 14v.01M14 20h3M20 17.99V20"/></svg>
      Mostre seu QR Code de perfil na barraca de resgate.
    </div>
    <div class="prem-grid" id="prem-grid"></div>
  </div>
</div>
<script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script defer src="js/firebase-config.js"></script>
<script defer src="js/auth.js"></script>
<script>document.addEventListener("DOMContentLoaded", () => exigirLogin());</script>
<script defer src="js/premios.js"></script>
<script defer src="js/nav.js"></script>
<script defer src="js/install-prompt.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Scanner · Malba TechVerse</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <meta name="theme-color" content="#241c5e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/fonts-ready.js"></script>
  <style>
    .camera-btn {
      display: flex; align-items: center; gap: 16px;
      background: linear-gradient(155deg, #fff, #f2f2f7);
      color: var(--color-ink);
      border-radius: var(--radius-lg); padding: 18px;
      font-family: var(--font-display); font-size: clamp(18px, 5.5vw, 21px); letter-spacing: 0.02em;
      box-shadow: 0 5px 0 #c7c7d1, 0 10px 24px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.5) inset;
      width: 100%; text-align: left; margin-top: 14px;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .camera-btn:active { transform: translateY(3px) scale(0.99); box-shadow: 0 2px 0 #c7c7d1, 0 4px 12px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.5) inset; }
    .camera-btn .qr-ico-wrap {
      width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
      background: linear-gradient(160deg, var(--color-bg-indigo), var(--color-bg-violet));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 16px rgba(74, 60, 168, 0.4);
    }
    .camera-btn .qr-ico { width: 26px; height: 26px; }
    .camera-btn small { display: block; font-family: var(--font-body); font-weight: 600; font-size: 12px; color: #6b6b7a; text-transform: none; letter-spacing: 0; margin-top: 2px; }

    .prize-link {
      display: flex; align-items: center; gap: 14px; padding: 16px;
      text-decoration: none; color: var(--color-white);
      transition: transform 0.1s ease;
    }
    .prize-link:active { transform: scale(0.98); }
    .prize-link .prize-icon {
      width: 52px; height: 52px; border-radius: var(--radius-md); flex-shrink: 0;
      background: linear-gradient(135deg, #ffd479, var(--color-accent-amber));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 16px rgba(245, 166, 35, 0.4);
    }
    .prize-link .prize-icon svg { width: 26px; height: 26px; color: var(--color-ink); }
    .prize-link .prize-text strong { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.02em; display: block; }
    .prize-link .prize-text span { font-size: 12.5px; color: var(--color-muted); }
    .prize-link .chevron { margin-left: auto; opacity: 0.5; flex-shrink: 0; }

    #reader-modal {
      position: fixed; inset: 0; background: #050310; z-index: 500;
      display: none; flex-direction: column;
    }
    #reader-modal.open { display: flex; }
    #reader { flex: 1; position: relative; overflow: hidden; }
    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      position: absolute;
      inset: 0;
    }

    /* Mira de escaneamento animada */
    .viewfinder {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(70vw, 260px); height: min(70vw, 260px);
      pointer-events: none; z-index: 6;
    }
    .viewfinder .corner {
      position: absolute; width: 34px; height: 34px;
      border: 3px solid var(--color-accent-cyan);
      filter: drop-shadow(0 0 6px rgba(79,214,210,0.7));
    }
    .viewfinder .tl { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 10px 0 0 0; }
    .viewfinder .tr { top: 0; right: 0; border-left: none; border-bottom: none; border-radius: 0 10px 0 0; }
    .viewfinder .bl { bottom: 0; left: 0; border-right: none; border-top: none; border-radius: 0 0 0 10px; }
    .viewfinder .br { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 10px 0; }
    .viewfinder .scan-line {
      position: absolute; left: 4%; right: 4%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--color-accent-cyan), transparent);
      box-shadow: 0 0 10px var(--color-accent-cyan);
      animation: scan-sweep 2.2s ease-in-out infinite;
    }
    @keyframes scan-sweep {
      0%, 100% { top: 6%; opacity: 0.9; }
      50% { top: 92%; opacity: 0.9; }
    }
    .reader-hint {
      position: absolute; bottom: calc(30% - 4px); left: 0; right: 0; text-align: center;
      font-size: 13px; color: rgba(255,255,255,0.75); font-weight: 600; z-index: 6; pointer-events: none;
    }

    .reader-close {
      position: absolute; top: calc(16px + var(--safe-top)); right: 16px; z-index: 10;
      background: rgba(255,255,255,0.15); color: #fff; border-radius: 50%;
      width: 40px; height: 40px; font-size: 20px; display: flex; align-items: center; justify-content: center;
    }
    .reader-result {
      position: absolute; bottom: calc(24px + var(--safe-bottom)); left: 16px; right: 16px;
      background: var(--color-white); color: var(--color-ink); border-radius: var(--radius-lg);
      padding: 16px; text-align: center; font-weight: 700; display: none; z-index: 8;
    }
    .reader-result.show { display: block; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div class="screen">
      <h1>Câmera</h1>
      <button class="camera-btn" id="open-scanner">
        <span class="qr-ico-wrap">
          <svg class="qr-ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            <path d="M14 14h3v3M20 14v.01M14 20h3M20 17.99V20"/>
          </svg>
        </span>
        <span>Capturar QR Code<small>+20 pontos por barraca</small></span>
      </button>

      <h2 class="section-title">Prêmios</h2>
      <a href="premios.html" class="card-badge prize-link">
        <span class="prize-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 7h-3.17A3 3 0 1012 5.17 3 3 0 007.17 7H4a1 1 0 00-1 1v3a1 1 0 001 1h1v7a1 1 0 001 1h12a1 1 0 001-1v-7h1a1 1 0 001-1V8a1 1 0 00-1-1zM12 4a1 1 0 11-1 1 1 1 0 011-1z"/></svg>
        </span>
        <span class="prize-text"><strong>Catálogo de prêmios</strong><span>Troque seus pontos por brindes</span></span>
        <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </div>
  </div>

  <!-- Modal de câmera -->
  <div id="reader-modal">
    <button class="reader-close" id="close-scanner">✕</button>
    <div id="reader"></div>
    <div class="viewfinder">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="scan-line"></div>
    </div>
    <p class="reader-hint">Aponte para o QR Code da barraca</p>
    <div class="reader-result" id="reader-result"></div>
  </div>

  <script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script defer src="js/firebase-config.js"></script>
  <script defer src="js/auth.js"></script>
  <script>document.addEventListener("DOMContentLoaded", () => exigirLogin());</script>

  <!-- Lib de leitura de QR pela câmera -->
  <script defer src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script defer src="js/barracas-config.js"></script>
  <script defer src="js/game-fx.js"></script>
  <script defer src="js/scanner.js"></script>

  <script defer src="js/nav.js"></script>
  <script defer src="js/install-prompt.js"></script>
</body>
</html>
